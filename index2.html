<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Option 2: Row-cols Utility</title>
	<!-- Connecting Bootstrap Framework -->
    <link href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel = "stylesheet">
    <link rel = "stylesheet" href = "css/style.css">
</head>
<body>
    <div class = "container mt-5">
        <!--
            Parent row defining 5 columns specifically for XL screens.
            For smaller screens, child classes will override this behavior.
        -->
        <div class = "row row-cols-xl-5 text-center text-white fw-bold fs-1">
            <div class = "col-12 col-sm-6 col-md-4 box-1">1</div>
            <div class = "col-12 col-sm-6 col-md-4 box-2">2</div>
            <div class = "col-12 col-sm-6 col-md-4 box-3">3</div>
            <div class = "col-12 col-sm-6 col-md-6 box-4">4</div>
            <div class = "col-12 col-sm-12 col-md-6 box-5">5</div>
            
        </div>
    </div>
</body>
</html>
