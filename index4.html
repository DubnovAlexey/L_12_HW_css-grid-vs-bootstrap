<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 4: CSS Grid Layout</title>
	<!-- Connecting Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Connecting common stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-5">
        <!--
            Wrapper with Bootstrap row and custom Grid class.
            Grid will be activated only on XL screens via CSS.
        -->
        <div class="row grid-xl-container text-center text-white fw-bold fs-1">
            
            <!-- Block 1 -->
            <div class="col-12 col-sm-6 col-md-4 box-1">1</div>
            
            <!-- Block 2 -->
            <div class="col-12 col-sm-6 col-md-4 box-2">2</div>
            
            <!-- Block 3 -->
            <div class="col-12 col-sm-6 col-md-4 box-3">3</div>
            
            <!-- Block 4 -->
            <div class="col-12 col-sm-6 col-md-6 box-4">4</div>
            
            <!-- Block 5 -->
            <div class="col-12 col-sm-12 col-md-6 box-5">5</div>
            
        </div>
    </div>
</body>
</html>
