<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Option 3: Custom CSS Class</title>
	<!-- Connecting Bootstrap Framework -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<!-- Connecting custom styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-5">
        <!-- Row wrapper -->
        <div class="row text-center text-white fw-bold fs-1">
            
            <!-- Block 1 -->
            <div class="col-12 col-sm-6 col-md-4 custom-col-xl box-1">1</div>
            
            <!-- Block 2 -->
            <div class="col-12 col-sm-6 col-md-4 custom-col-xl box-2">2</div>
            
            <!-- Block 3 -->
            <div class="col-12 col-sm-6 col-md-4 custom-col-xl box-3">3</div>
            
            <!-- Block 4 -->
            <div class="col-12 col-sm-6 col-md-6 custom-col-xl box-4">4</div>
            
            <!-- Block 5 -->
            <div class="col-12 col-sm-12 col-md-6 custom-col-xl box-5">5</div>
            
        </div>
    </div>
</body>
</html>
